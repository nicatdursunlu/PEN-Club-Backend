databaseChangeLog:
  - changeSet:
      id: 006-update-event-status-workflow
      author: codex
      changes:
        - sql:
            sql: ALTER TABLE events DROP CONSTRAINT IF EXISTS events_status_check
        - update:
            tableName: events
            columns:
              - column:
                  name: status
                  value: PUBLISHED
            where: status = 'UPCOMING'
        - sql:
            sql: ALTER TABLE events ADD CONSTRAINT events_status_check CHECK (status IN ('DRAFT', 'PUBLISHED', 'CANCELLED', 'COMPLETED'))
